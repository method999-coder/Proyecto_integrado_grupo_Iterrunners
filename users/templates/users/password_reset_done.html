{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Correo enviado | Iter Runners</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=147">
</head>
<body class="auth-page">
  <div class="auth-wrapper">
    <h1 class="auth-brand">RUNNERS APP</h1>

    <div class="auth-card">
      <h2 class="auth-title">Revisa tu correo</h2>
      <p style="opacity:.85; font-size:14px; margin-bottom:14px;">
        Si el correo ingresado pertenece a una cuenta activa, recibirás un enlace para crear una nueva contraseña.
      </p>

      <div class="auth-links">
        <a href="{% url 'login' %}" class="auth-link">Volver al inicio de sesión</a>
      </div>
    </div>
  </div>
</body>
</html>
